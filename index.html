<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="https://unpkg.com/ress/dist/ress.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>
  <div id="card">
    <div id="card-header"><img src="./assets/images/illustration-article.svg" alt="illustration-article"></div>

    <div id="card-center">
      <span>Learning</span>
      <time datetime="2023-12-21">Published 21 Dec 2023</time>
      <h1><a href="#">HTML & CSS foundations</a></h1>
      <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
    </div>

    <div id="card-footer">
      <div id="image-avatar"><img src="./assets/images/image-avatar.webp" alt="image-avatar"></div>
      <span id="avatar-name">Greg Hooper</span>
    </div>
  </div>
</body>

</html>
